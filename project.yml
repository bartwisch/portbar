name: PortBar
options:
  bundleIdPrefix: com.christoph
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  PortBar:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - PortBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.christoph.PortBar
        PRODUCT_NAME: PortBar
        INFOPLIST_FILE: PortBar/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  PortBarTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - PortBarTests
    dependencies:
      - target: PortBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.christoph.PortBarTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PortBar.app/Contents/MacOS/PortBar"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PortBar:
    build:
      targets:
        PortBar: all
        PortBarTests: [test]
    test:
      targets:
        - PortBarTests
